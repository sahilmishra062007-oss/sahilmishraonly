    <style>
        /* Navbar Glass Effect */
        .navbar {

        .search-container {

        .pill {

            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 20px;
            border-radius: 50px;
            cursor: pointer;

            font-size: 0.85rem;
        }
        .pill.active {
            background: var(--primary);

        /* Special Button Glow */
