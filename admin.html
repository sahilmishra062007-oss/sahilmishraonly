<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Finder | Secure Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <style>
        .login-screen {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        /* Dashboard styles (Sirf login ke baad kaam aayenge) */
        .preview-box {
            width: 70px; height: 70px; border-radius: 16px; 
            background: white; margin: 10px 0 20px; 
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--primary);
        }
        .preview-box img { width: 75%; height: 75%; object-fit: contain; }
        #adminToolsList::-webkit-scrollbar { width: 6px; }
        #adminToolsList::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body data-theme="dark">

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-icon" style="font-size: 3.5rem; color: var(--primary); margin-bottom: 20px;">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h1 class="gradient-text">Admin Access</h1>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">Enter credentials to unlock control center</p>
            
            <div class="login-form">
                <input type="password" id="adminPassword" placeholder="••••••••" 
                       style="text-align: center; font-size: 1.5rem; letter-spacing: 8px; width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white;">
                <button id="loginBtn" class="btn-visit" style="width: 100%; border: none; cursor: pointer; margin-top: 25px; padding: 18px; border-radius: 12px;">
                    Authenticate Now
                </button>
            </div>
            <div class="login-footer" style="margin-top: 25px;">
                <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">
                    <i class="fa-solid fa-house"></i> Back to Homepage
                </a>
            </div>
        </div>
    </div>

    <div id="dynamicAdminRoot"></div>

    <script src="script.js"></script>
</body>
</html>
