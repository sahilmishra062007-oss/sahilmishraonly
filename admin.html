<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Finder | Secure Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.0/firebase-database-compat.js"></script>

    <style>
        /* Admin Specific UI Upgrades */
        .login-screen {
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
            padding: 40px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.1);
            width: 100%; max-width: 400px; text-align: center;
        }
        .preview-box {
            width: 60px; height: 60px; border-radius: 12px; background: #fff;
            margin-top: 10px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 2px solid var(--primary);
        }
        .preview-box img { width: 80%; height: 80%; object-fit: contain; }
        .admin-stat-card { transition: 0.3s; cursor: default; }
        .admin-stat-card:hover { transform: translateY(-5px); background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body data-theme="dark">

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toUpperCase() === 'U')) {
                e.preventDefault();
            }
        });
    </script>

    <div id="toastContainer" class="toast-container"></div>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-icon" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;">
                <i class="fa-solid fa-fingerprint"></i>
            </div>
            <h1>Admin Access</h1>
            <p style="color: var(--text-secondary); margin-bottom: 30px;">Authenticate to manage AI tools</p>
            
            <div class="login-form">
                <input type="password" id="adminPassword" placeholder="••••••••" 
                       style="text-align: center; font-size: 1.2rem; letter-spacing: 5px;">
                <button id="loginBtn" class="btn-visit" style="width: 100%; border: none; cursor: pointer; margin-top: 20px;">
                    Unlock Dashboard
                </button>
            </div>
            <div class="login-footer" style="margin-top: 20px;">
                <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">
                    <i class="fa-solid fa-arrow-left"></i> Exit to Hub
                </a>
            </div>
        </div>
    </div>

    <div id="adminDashboard" class="admin-dashboard hidden">
        <nav class="navbar">
            <div class="nav-brand"><i class="fa-solid fa-shield-halved"></i> <span>Control Center</span></div>
            <div class="nav-links">
                <button id="logoutBtn" class="pill" style="background: var(--danger); color: white; border: none;">Logout</button>
            </div>
        </nav>

        <main class="dashboard-content" style="padding: 2rem 5%;">
            <div class="admin-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px;">
                <div class="admin-stat-card tool-card">
                    <h3 id="adminStatTools">0</h3>
                    <p>Live Tools</p>
                </div>
                <div class="admin-stat-card tool-card">
                    <h3 id="adminStatClicks">0</h3>
                    <p>Total Traffic</p>
                </div>
                <div class="admin-stat-card tool-card">
                    <h3 id="adminLastUpdated">-</h3>
                    <p>Active Session</p>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px;">
                <section class="admin-section tool-card">
                    <h2>Add New AI Tool</h2>
                    <form id="addToolForm" style="margin-top: 20px;">
                        <input type="text" id="addName" placeholder="Tool Name (e.g. Midjourney)" required>
                        <select id="addCategory" required>
                            <option value="chatbot">💬 Chatbot</option>
                            <option value="image">🎨 Image Art</option>
                            <option value="video">🎬 Video Creation</option>
                            <option value="audio">🎵 Audio/Music</option>
                        </select>
                        <input type="text" id="toolImage" placeholder="Logo Link (Direct URL)" oninput="document.getElementById('imgPrev').src = this.value">
                        <div class="preview-box"><img id="imgPrev" src="https://cdn-icons-png.flaticon.com/512/2103/2103633.png"></div>
                        <input type="url" id="addLink" placeholder="Website URL" required style="margin-top:15px;">
                        <textarea id="addDesc" placeholder="Short Catchy Description..." required></textarea>
                        <button type="submit" class="btn-visit" style="width: 100%; border: none;">Publish Tool</button>
                    </form>
                </section>

                <section class="admin-section tool-card">
                    <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <h2>Manage Database</h2>
                        <input type="text" id="adminSearch" placeholder="Filter tools..." style="width: 200px; margin-bottom: 0;">
                    </div>
                    <div id="adminToolsList" style="margin-top: 20px; max-height: 500px; overflow-y: auto;">
                        </div>
                </section>
            </div>
        </main>
    </div>

    <script>
        (function(){
            // Your password is "20180047226" - encoded as HEX
            const _a = [0x32,0x30,0x31,0x38,0x30,0x30,0x34,0x37,0x32,0x32,0x36];
            const _d = () => _a.map(x => String.fromCharCode(x)).join('');
            window._vp = (i) => i === _d();
            window._ia = true;
        })();
    </script>
    <script src="script.js"></script>
</body>
</html>
