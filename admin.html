<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    
    <!-- 🔒 Block Inspect Methods -->
    <script>
        // Block right click
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // Block keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+I
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+Shift+C
            if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c' || e.keyCode === 67)) {
                e.preventDefault();
                return false;
            }
            // Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</head>
<body data-theme="light">

    <!-- 🔒 DevTools Detection -->
    <script>
        (function() {
            const detectDevTools = function() {
                const widthThreshold = window.outerWidth - window.innerWidth > 160;
                const heightThreshold = window.outerHeight - window.innerHeight > 160;
                
                if (widthThreshold || heightThreshold) {
                    document.body.innerHTML = '<div style="display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh;background:#0f172a;color:#ef4444;font-family:Inter,sans-serif;"><i class="fa-solid fa-shield-halved" style="font-size:4rem;margin-bottom:1rem;"></i><h1>⚠️ Access Blocked</h1><p style="color:#94a3b8;">Developer tools detected. Access denied.</p></div>';
                }
            };
            
            setInterval(detectDevTools, 1000);
            window.addEventListener('resize', detectDevTools);
        })();
    </script>

    <!-- Toast Notifications -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>Admin Access</h1>
            <p>Enter your password to continue</p>
            
            <div class="login-form">
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="adminPassword" placeholder="Enter password" autofocus autocomplete="off">
                </div>
                <div id="errorMsg" class="error-msg hidden">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Incorrect password</span>
                </div>
                <button id="loginBtn" class="btn-login">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </div>
            
            <div class="login-footer">
                <a href="index.html"><i class="fa-solid fa-arrow-left"></i> Back to Website</a>
            </div>
        </div>
    </div>

    <!-- ADMIN DASHBOARD -->
    <div id="adminDashboard" class="admin-dashboard hidden">
        
        <nav class="admin-navbar">
            <div class="nav-brand">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Admin Panel</span>
            </div>
            
            <div class="admin-nav-actions">
                <a href="index.html" class="btn-view-site">
                    <i class="fa-solid fa-eye"></i> View Site
                </a>
                <button id="logoutBtn" class="btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </nav>

        <div class="dashboard-content">
            
            <!-- Stats -->
            <div class="admin-stats">
                <div class="admin-stat-card">
                    <div class="stat-icon blue"><i class="fa-solid fa-cubes"></i></div>
                    <div class="stat-info">
                        <h3 id="adminStatTools">0</h3>
                        <p>Total Tools</p>
                    </div>
                </div>
                <div class="admin-stat-card">
                    <div class="stat-icon green"><i class="fa-solid fa-mouse-pointer"></i></div>
                    <div class="stat-info">
                        <h3 id="adminStatClicks">0</h3>
                        <p>Total Clicks</p>
                    </div>
                </div>
                <div class="admin-stat-card">
                    <div class="stat-icon purple"><i class="fa-solid fa-clock"></i></div>
                    <div class="stat-info">
                        <h3 id="adminLastUpdated">-</h3>
                        <p>Last Updated</p>
                    </div>
                </div>
            </div>

            <!-- Add Tool -->
            <div class="admin-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-plus-circle"></i> Add New Tool</h2>
                </div>
                <form id="addToolForm" class="add-tool-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tool Name *</label>
                            <input type="text" id="addName" required placeholder="e.g., ChatGPT">
                        </div>
                        <div class="form-group">
                            <label>Category *</label>
                            <select id="addCategory" required>
                                <option value="">Select...</option>
                                <option value="chatbot">💬 Chatbot</option>
                                <option value="image">🎨 Image</option>
                                <option value="video">🎬 Video</option>
                                <option value="audio">🎵 Audio</option>
                                <option value="productivity">⚡ Productivity</option>
                                <option value="coding">💻 Coding</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Website URL *</label>
                        <input type="url" id="addLink" required placeholder="https://...">
                    </div>
                    <div class="form-group">
                        <label>Description *</label>
                        <textarea id="addDesc" required rows="3" placeholder="What does this tool do?"></textarea>
                    </div>
                    <button type="submit" class="btn-add">
                        <i class="fa-solid fa-plus"></i> Add Tool
                    </button>
                </form>
            </div>

            <!-- Manage Tools -->
            <div class="admin-section">
                <div class="section-header">
                    <h2><i class="fa-solid fa-list-check"></i> Manage Tools</h2>
                    <span class="tool-count" id="toolCount">0 tools</span>
                </div>
                <div class="tools-list" id="adminToolsList"></div>
            </div>

        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-pen-to-square"></i> Edit Tool</h3>
                <button class="btn-close" onclick="closeEditModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="editToolForm" class="modal-body">
                <input type="hidden" id="editId">
                <div class="form-group">
                    <label>Tool Name *</label>
                    <input type="text" id="editName" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="editCategory" required>
                            <option value="chatbot">💬 Chatbot</option>
                            <option value="image">🎨 Image</option>
                            <option value="video">🎬 Video</option>
                            <option value="audio">🎵 Audio</option>
                            <option value="productivity">⚡ Productivity</option>
                            <option value="coding">💻 Coding</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Website URL *</label>
                        <input type="url" id="editLink" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="editDesc" required rows="3"></textarea>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeEditModal()">Cancel</button>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-save"></i> Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DELETE MODAL -->
    <div id="deleteModal" class="modal">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-sm">
            <div class="delete-confirm">
                <div class="delete-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <h3>Delete Tool?</h3>
                <p>Are you sure you want to delete <strong id="deleteToolName">this tool</strong>?</p>
                <p class="delete-warning">This cannot be undone!</p>
                <div class="form-actions">
                    <button class="btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                    <button id="confirmDeleteBtn" class="btn-danger"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🔐 ULTRA SECURE PASSWORD SYSTEM -->
    <script>
        (function(){
            // Password stored as character codes - NOT readable directly
            // Your password: 20180047226
            const _a = [0x32,0x30,0x31,0x38,0x30,0x30,0x34,0x37,0x32,0x32,0x36];
            
            // Decode function
            const _d = function() {
                return _a.map(function(x) { 
                    return String.fromCharCode(x); 
                }).join('');
            };
            
            // Verify password - this is the only way to check
            window._vp = function(i) {
                if (!i || typeof i !== 'string') return false;
                return i === _d();
            };
            
            // Session timeout
            window._st = 30 * 60 * 1000;
            
            // Mark as admin page
            window._ia = true;
            
            // Clear console
            console.clear();
            console.log('%c⚠️ Warning!', 'color: red; font-size: 30px; font-weight: bold;');
            console.log('%cThis is a secure area. Unauthorized access is prohibited.', 'color: gray; font-size: 14px;');
        })();
    </script>
    <script src="script.js"></script>

</body>

</html>
